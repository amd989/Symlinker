name: Release

on:
  push:
    tags: [v*]

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Setup Git
        run: |
          git config --global url."https://user:${{ secrets.GITHUB_TOKEN }}@github".insteadOf https://github
          git config --global user.name github-actions
          git config --global user.email github-actions@github.com

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "Version: $version"

      - name: Build portable distribution for Scoop (unsigned)
        shell: pwsh
        run: ./build-portable.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Upload unsigned portable artifacts
        id: upload-portable
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-portable-${{ steps.version.outputs.version }}
          path: Symlinker/bin/portable/

      - name: Sign portable executable
        id: signpath-portable
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ secrets.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: '${{ secrets.SIGNPATH_PROJECT_SLUG }}'
          signing-policy-slug: '${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}'
          artifact-configuration-slug: 'Portable'
          github-artifact-id: '${{ steps.upload-portable.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'Symlinker/bin/portable-signed'
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}

      - name: Create signed portable ZIP
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $zipName = "symlinker-$version-portable.zip"

          # Remove unsigned ZIP if exists
          if (Test-Path $zipName) {
            Remove-Item $zipName -Force
          }

          # Create ZIP from signed artifacts
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            (Resolve-Path "Symlinker/bin/portable-signed").Path,
            (Join-Path (Get-Location) $zipName),
            [System.IO.Compression.CompressionLevel]::Optimal,
            $false
          )

          Write-Output "Created signed portable ZIP: $zipName"

      - name: Create GitHub Release with signed portable ZIP
        uses: softprops/action-gh-release@v1
        with:
          files: symlinker-${{ steps.version.outputs.version }}-portable.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Partner Center signs Store packages, so this bundle is uploaded unsigned.
      - name: Build MSIX bundle for Microsoft Store
        shell: pwsh
        run: ./build-msix.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Upload MSIX bundle
        uses: actions/upload-artifact@v4
        with:
          name: msix-${{ steps.version.outputs.version }}
          path: Symlinker/bin/msix/*.msixbundle
          if-no-files-found: error
          # The store job uses it right away; a big unsigned bundle needn't stay for 90 days.
          retention-days: 30

      - name: Build ClickOnce package (unsigned)
        shell: pwsh
        run: ./release.ps1 -OnlyBuild

      - name: Upload unsigned ClickOnce artifacts
        id: upload-clickonce
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-clickonce-${{ steps.version.outputs.version }}
          path: Symlinker/bin/publish/

      - name: Submit signing request to SignPath
        id: signpath
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ secrets.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: '${{ secrets.SIGNPATH_PROJECT_SLUG }}'
          signing-policy-slug: '${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}'
          artifact-configuration-slug: 'ClickOnce'
          github-artifact-id: '${{ steps.upload-clickonce.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'signed-clickonce'
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}

      - name: Deploy signed ClickOnce to gh-pages
        shell: pwsh
        run: ./release.ps1 -SignedArtifactDir "signed-clickonce"

  store:
    name: Publish to Microsoft Store
    needs: release
    # Off until the repository variable STORE_AUTO_PUBLISH is 'true'. Turn it on once the first
    # submission is published: the Store CLI can't make a first submission, and a submission still
    # in certification blocks a new one.
    if: vars.STORE_AUTO_PUBLISH == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      STORE_APP_ID: 9P8H93Z0TGK4
      VERSION: ${{ needs.release.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download MSIX bundle
        uses: actions/download-artifact@v4
        with:
          name: msix-${{ env.VERSION }}
          path: msix

      - name: Set up Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.4
        with:
          version: v0.4.4

      - name: Sign in to Partner Center
        shell: pwsh
        env:
          STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
          STORE_SELLER_ID: ${{ secrets.STORE_SELLER_ID }}
          STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
        run: |
          msstore reconfigure --tenantId $env:STORE_TENANT_ID --sellerId $env:STORE_SELLER_ID `
            --clientId $env:STORE_CLIENT_ID --clientSecret $env:STORE_CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure failed ($LASTEXITCODE)." }

      # Makes a new draft from the last published submission (listings, screenshots and options
      # carry over) and replaces its package with this bundle.
      - name: Upload bundle to a draft submission
        shell: pwsh
        run: |
          $bundle = Get-ChildItem msix -Filter *.msixbundle | Select-Object -First 1
          if (-not $bundle) { throw "No .msixbundle in the msix-$env:VERSION artifact." }
          msstore publish $bundle.FullName --appId $env:STORE_APP_ID --noCommit --uploadTimeout 3600
          if ($LASTEXITCODE -ne 0) { throw "msstore publish failed ($LASTEXITCODE)." }

      - name: Set What's new from listings.json
        shell: pwsh
        run: ./packaging/msix/store/set-release-notes.ps1 -Version $env:VERSION -ProductId $env:STORE_APP_ID

      - name: Submit for certification
        shell: pwsh
        run: |
          msstore submission publish $env:STORE_APP_ID
          if ($LASTEXITCODE -ne 0) { throw "msstore submission publish failed ($LASTEXITCODE)." }
          msstore submission status $env:STORE_APP_ID