name: CI

on:
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Symlinker/Symlinker.csproj --configuration Release

      - name: Test (fails below 100% coverage)
        run: dotnet test --project Symlinker.Tests/Symlinker.Tests.csproj --configuration Release

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: TestResults/*.cobertura.xml
          if-no-files-found: ignore
